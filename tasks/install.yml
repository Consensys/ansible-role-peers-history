---
- name: install | Lookup peers_history user
  getent:
    database: passwd
    key: "{{ peers_history_user }}"
  register: peers_history_user_entry
  failed_when: false


- name: install | Determine if peers_history user exists
  set_fact:
    peers_history_user_exists: "{{ peers_history_user in (peers_history_user_entry.ansible_facts.getent_passwd | default({})) }}"

- block:

  - name: install | Extract current UID (only if user exists)
    set_fact:
      peers_history_current_uid: "{{ peers_history_user_entry.ansible_facts.getent_passwd[peers_history_user][1] | int }}"

  - name: install | Determine if UID update is needed
    set_fact:
      peers_history_uid_needs_update: "{{ peers_history_current_uid != peers_history_uid }}"

  - name: install | Stop enabled peers_history services if UID needs update
    service:
      name: "peers-history"
      state: stopped
    when:
      - peers_history_uid_needs_update
    become: true

  - name: install | Set updated optionally to trigger a systemd restart at the end
    set_fact:
      peers_history_state_updates: "{{ peers_history_state_updates + ['peers_history.uid'] }}"
    when:
      - peers_history_uid_needs_update

  when: peers_history_user_exists

- name: Ensure peers_history group exists
  group:
    name: "{{ peers_history_group }}"
    gid: "{{ peers_history_gid }}"    
    state: present
  become: true

- name: Create peers_history user
  user:
    comment:  peers_history client user
    name: "{{ peers_history_user }}"
    uid: "{{ peers_history_uid }}"
    group: "{{ peers_history_group }}"
  become: true

- name: Create base directory
  file:
    path: "{{ peers_history_base_dir }}"
    state: directory
    owner: "{{ peers_history_user }}"
    group: "{{ peers_history_group }}"
  become: true

- name: Create data directory
  file:
    path: "{{ peers_history_data_dir }}"
    state: directory
    owner: "{{ peers_history_user }}"
    group: "{{ peers_history_group }}"
    recurse: yes
  become: true

- name: Create install directory
  file:
    path: "{{ peers_history_install_dir }}"
    state: directory
    owner: "{{ peers_history_user }}"
    group: "{{ peers_history_group }}"
  become: true

- name: Create log directory
  file:
    path: "{{ peers_history_log_dir }}"
    state: directory
    owner: "{{ peers_history_user }}"
    group: "{{ peers_history_group }}"
  become: true

- name: Remove logrotate config if it exists
  file:
    path: "/etc/logrotate.d/peers_history"
    state: absent
  become: true

- name: Extract peers_history source to install directory
  unarchive:
    src: "{{ peers_history_download_url }}"
    remote_src: yes
    dest: "{{ peers_history_install_dir }}"
    owner: "{{ peers_history_user }}"
    group: "{{ peers_history_group }}"
    mode: '0775'
    extra_opts:
      - --strip-components
      - '1'
  become: true

- name: Create a symlink to current
  file:
    src: "{{ peers_history_install_dir }}/"
    dest: "{{ peers_history_current_dir }}"
    state: link
  become: true
  register: link_current

- name: Set updated optionally to trigger a systemd restart at the end
  set_fact:
    peers_history_state_updates: "{{ peers_history_state_updates + ['peers_history.install_dir'] }}"
  when: link_current is changed
